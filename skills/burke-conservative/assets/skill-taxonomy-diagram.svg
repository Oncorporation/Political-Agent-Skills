yle="stroke: rgb(153, 153, 153); stroke-width: 1px;"/><line x1="32" y1="257" x2="494" y2="257" style="stroke: rgb(153, 153, 153); stroke-width: 1px;"/></g><g class="data-points"><g class="data-point"><circle cx="379" cy="299.4" r="5" fill="hsl(0, 0%, NaN%)" stroke="hsl(0, 0%, NaN%)" stroke-width="0px"/><text x="0" y="0" fill="#333" font-size="12" dominant-baseline="hanging" text-anchor="middle" transform="translate(379, 304.4) rotate(0)">counter-chaos</text></g><g class="data-point"><circle cx="425.4" cy="87.39999999999999" r="5" fill="hsl(0, 0%, NaN%)" stroke="hsl(0, 0%, NaN%)" stroke-width="0px"/><text x="0" y="0" fill="#333" font-size="12" dominant-baseline="hanging" text-anchor="middle" transform="translate(425.4, 92.39999999999999) rotate(0)">burke-conservative</text></g><g class="data-point"><circle cx="402.2" cy="129.79999999999998" r="5" fill="hsl(0, 0%, NaN%)" stroke="hsl(0, 0%, NaN%)" stroke-width="0px"/><text x="0" y="0" fill="#333" font-size="12" dominant-baseline="hanging" text-anchor="middle" transform="translate(402.2, 134.79999999999998) rotate(0)">civilization-preserve</text></g><g class="data-point"><circle cx="123.8" cy="341.79999999999995" r="5" fill="hsl(0, 0%, NaN%)" stroke="hsl(0, 0%, NaN%)" stroke-width="0px"/><text x="0" y="0" fill="#333" font-size="12" dominant-baseline="hanging" text-anchor="middle" transform="translate(123.8, 346.79999999999995) rotate(0)">chaos-seize</text></g></g><g class="labels"><g class="label"><text x="0" y="0" fill="#333" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(147, 479) rotate(0)">Disruption</text></g><g class="label"><text x="0" y="0" fill="#333" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(379, 479) rotate(0)">Preservation</text></g><g class="label"><text x="0" y="0" fill="#333" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(5, 363) rotate(-90)">Tactical</text></g><g class="label"><text x="0